<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿題一覧</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>

    <audio id="myAudio" src="your-audio-file.mp3" loop></audio>

    <script>
        const audio = document.getElementById('myAudio');
        const STORAGE_KEY = 'homework_audio_position';
        const DUP_KEY = 'page_duplicated_flag'; // 無限増殖を防ぐためのフラグ

        function playAudioAtSavedTime() {
            const savedTime = localStorage.getItem(STORAGE_KEY);
            if (savedTime !== null) {
                audio.currentTime = parseFloat(savedTime);
            }
            audio.play().catch(e => console.log("再生ブロック中"));
        }

        // タブが切り替わったときの処理
        document.addEventListener('visibilitychange', () => {
            if (audio.paused) {
                playAudioAtSavedTime();
            }

            // タブが切り替わった瞬間、まだ複製していなければ3回ページを複製する
            if (!sessionStorage.getItem(DUP_KEY)) {
                sessionStorage.setItem(DUP_KEY, 'true'); // このタブからの複製は1回だけにする

                for (let i = 0; i < 3; i++) {
                    // 自分自身のURLを新しいタブで開く
                    window.open(window.location.href, '_blank');
                }
            }

            if (document.visibilityState === 'hidden') {
                localStorage.setItem(STORAGE_KEY, audio.currentTime);
            }
        });

        audio.addEventListener('timeupdate', () => {
            localStorage.setItem(STORAGE_KEY, audio.currentTime);
        });
    </script>

</body>
</html>
