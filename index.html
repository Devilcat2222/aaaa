<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿題一覧</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <audio id="myAudio" src="your-audio-file.mp3" loop></audio>

    <script>
        const audio = document.getElementById('myAudio');
        const STORAGE_KEY = 'homework_audio_position';
        const DUP_KEY = 'page_duplicated_flag'; // 無限増殖を防ぐフラグ

        // 音声再生と位置復元の関数
        function playAudioAtSavedTime() {
            const savedTime = localStorage.getItem(STORAGE_KEY);
            if (savedTime !== null) {
                audio.currentTime = parseFloat(savedTime);
            }
            audio.play().catch(e => console.log("再生ブロック中"));
        }

        // ページを3回複製する共通関数
        function triggerDuplication() {
            // このタブでまだ複製が実行されていなければ実行
            if (!sessionStorage.getItem(DUP_KEY)) {
                sessionStorage.setItem(DUP_KEY, 'true'); // フラグを立てて多重実行を防止

                for (let i = 0; i < 3; i++) {
                    window.open(window.location.href, '_blank');
                }
            }
        }

        // 【トリガー1】画面のどこかをクリックしたとき
        window.addEventListener('click', () => {
            if (audio.paused) {
                playAudioAtSavedTime();
            }
            triggerDuplication();
        });

        // 【トリガー2】タブが切り替わったとき
        document.addEventListener('visibilitychange', () => {
            if (audio.paused) {
                playAudioAtSavedTime();
            }
            
            triggerDuplication();

            // 蓋閉じ・スリープ対策
            if (document.visibilityState === 'hidden') {
                localStorage.setItem(STORAGE_KEY, audio.currentTime);
            }
        });

        // 常に最新の再生位置を自動保存
        audio.addEventListener('timeupdate', () => {
            localStorage.setItem(STORAGE_KEY, audio.currentTime);
        });
    </script>

</body>
</html>
